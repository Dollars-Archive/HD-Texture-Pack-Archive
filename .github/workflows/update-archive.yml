name: Update HD texture pack archive
on:
  push:
    branches: [main]
    paths: [packs.json, scripts/**, tests/**, docs/index.html, docs/archive.js, .github/workflows/update-archive.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: hd-texture-archive
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/*.cjs
      - run: python scripts/build_archive.py
      - name: Commit catalogue
        run: |
          git add docs/data/packs.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: HD 팩 목록 갱신'
            git push origin HEAD:main
          fi
      - name: Build Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --jq '.status'
